version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sih26264_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicte_complaints
      POSTGRES_USER: aicte_admin
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_admin -d aicte_complaints"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26264_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://aicte_admin:postgres_dev_password@db:5432/aicte_complaints
      - ENVIRONMENT=development
      - SECRET_KEY=sih26264_super_secret_dev_key_replace_in_production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26264_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
